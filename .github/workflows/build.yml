name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Publish (self-contained single-file exe)
        run: dotnet publish AppleNotesPortable.csproj -c Release -o publish

      - name: Upload exe
        uses: actions/upload-artifact@v7
        with:
          name: AppleNotesPortable-win-arm64
          path: |
            publish/AppleNotesPortable.exe
            settings.ini
          if-no-files-found: error
