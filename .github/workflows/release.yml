name: Release

# Push a tag like v1.0.0 to build that version and publish a GitHub Release
# with the .exe attached. Tags with a suffix (v1.1.0-beta1) become pre-releases.
on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: write   # needed to create the release

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Get version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish (version stamped into the exe)
        run: dotnet publish AppleNotesPortable.csproj -c Release -o publish -p:Version=${{ env.VERSION }}

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && PRE="--prerelease"
          gh release create "$GITHUB_REF_NAME" publish/AppleNotesPortable.exe \
            --title "AppleNotesPortable $GITHUB_REF_NAME" \
            --generate-notes $PRE
